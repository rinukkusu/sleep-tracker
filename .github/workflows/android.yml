name: Android APK

on:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - public/**
      - package*.json
      - capacitor.config.ts
      - scripts/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run check
      - name: Native id
        run: echo "NATIVE_ID=$(node scripts/native-id.mjs)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_PB_URL: ${{ vars.PB_URL }}
          VITE_WEB_VERSION: ${{ github.sha }}
      - run: npx cap sync android
      # Firebase config for FCM (not in the public repo).
      - name: google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: if [ -n "$GOOGLE_SERVICES" ]; then echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json; fi

      # Over-the-air update of the web part for APKs with the same native id (src/lib/ota.ts).
      - name: Update bundle
        env:
          VERSION: ${{ github.sha }}
          TAG: android-1.${{ github.run_number }}
          APK: schlaf-tracker-1.${{ github.run_number }}.apk
        run: |
          (cd dist && zip -qr "$RUNNER_TEMP/bundle.zip" .)
          export CHECKSUM=$(sha256sum "$RUNNER_TEMP/bundle.zip" | cut -d' ' -f1)
          node -e 'const e = process.env; console.log(JSON.stringify({ version: e.VERSION, nativeId: e.NATIVE_ID, tag: e.TAG, apk: e.APK, bundle: "bundle.zip", checksum: e.CHECKSUM }))' > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      # Without the keystore secrets only a debug APK is built (to check the build),
      # since updates must always be signed with the same key.
      - name: Build APK
        id: apk
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/schlaf-tracker-1.$VERSION_CODE.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/schlaf-tracker-1.$VERSION_CODE-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: schlaf-tracker-apk
          path: ${{ runner.temp }}/schlaf-tracker-*.apk

      - name: Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" "$RUNNER_TEMP"/schlaf-tracker-*.apk "$RUNNER_TEMP/bundle.zip" "$RUNNER_TEMP/latest.json" \
            --title "Android 1.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message || 'Manual build' }}"
