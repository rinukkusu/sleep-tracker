name: Android APK

on:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - public/**
      - package*.json
      - capacitor.config.ts
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_PB_URL: ${{ vars.PB_URL }}
      - run: npx cap sync android

      # Without the keystore secrets only a debug APK is built (to check the build),
      # since updates must always be signed with the same key.
      - name: Build APK
        id: apk
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/schlaf-tracker-1.$VERSION_CODE.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/schlaf-tracker-1.$VERSION_CODE-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: schlaf-tracker-apk
          path: ${{ runner.temp }}/schlaf-tracker-*.apk

      - name: Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" "$RUNNER_TEMP"/schlaf-tracker-*.apk \
            --title "Android 1.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message || 'Manual build' }}"
